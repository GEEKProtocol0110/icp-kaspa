# Install into sshd_config.d on the SIGNER host; validate with sshd -t first.
# Dedicated account with /bin/sh, locked password, root-owned home and authorized key.
Match User icp-recovery
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/icp-recovery/authorized_keys
    ForceCommand /usr/local/libexec/icp-recovery-command
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    X11Forwarding no
    MaxSessions 1
Match all
