[package]
name = "icp-testnet"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac", optional = true }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }

[features]
live = ["dep:kaspa-rpc-core", "dep:kaspa-wrpc-client", "dep:tokio"]

[[bin]]
name = "icp"
path = "src/main.rs"
required-features = ["live"]

[[bin]]
name = "icp-protected"
path = "src/protected_main.rs"
required-features = ["live"]

[[example]]
name = "fund_protected_pilot"
path = "examples/fund_protected_pilot.rs"
required-features = ["live"]

[[example]]
name = "prepare_transfer_anchor"
path = "examples/prepare_transfer_anchor.rs"
required-features = ["live"]
test = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
