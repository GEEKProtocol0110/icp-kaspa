<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">ICP — Internal Command Protocol</title>
  <desc id="description">Rules for withdrawals. Time for recovery. An experimental vault built on Kaspa Testnet-10, illustrated by a teal shield connected to a geometric network.</desc>
