    <text x="64" y="371" font-size="46" font-weight="bold" letter-spacing="-1" fill="#eafaf6">Rules for withdrawals.</text>
    <text x="64" y="429" font-size="46" font-weight="bold" letter-spacing="-1" fill="#eafaf6">Time for recovery.</text>
    <text x="68" y="492" font-size="19" fill="#92adb5">An experimental vault built on Kaspa.</text>
    <text x="64" y="590" font-size="14" letter-spacing="3" fill="#83b7b7">RULES</text>
