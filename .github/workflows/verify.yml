name: Verify ICP prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: python3 scripts/compile.py
      - run: python3 scripts/compile_protected.py --fixtures
      - run: cargo fmt --check
      - run: cargo test --locked --features live
      - run: python3 -m pip install --only-binary=:all: -r requirements-lab.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/transfer_lab.py
      - run: sh -n deploy/icp-recovery-command
      - run: systemd-analyze verify deploy/*.service deploy/*.timer
