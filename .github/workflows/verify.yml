name: Verify ICP prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: python3 scripts/compile.py
      - run: python3 scripts/compile_protected.py --fixtures
      - run: cargo fmt --check
      - run: cargo test --locked --features live
      - run: 'python3 -m pip install --only-binary=:all: -r requirements-lab.txt'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/transfer_lab.py
      - run: python3 scripts/transfer_anchor.py
      - run: python3 scripts/release_ledger_model.py
      - run: python3 scripts/recipient_lab.py
      - run: python3 scripts/release_coordinator_model.py
      - run: sh -n deploy/icp-recovery-command
      - run: systemd-analyze verify deploy/*.service deploy/*.timer
      - run: cargo build --locked --features live --bins --example prepare_transfer_anchor
      - run: sha256sum target/debug/icp target/debug/examples/prepare_transfer_anchor > target/anchor-binaries.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tn10-anchor-binaries
          retention-days: 7
          if-no-files-found: error
          path: |
            target/debug/icp
            target/debug/examples/prepare_transfer_anchor
            target/anchor-binaries.sha256
